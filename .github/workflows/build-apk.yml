name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          for f in *; do
            if file "$f" | grep -q "Zip archive"; then
              unzip -o "$f"
            fi
          done

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Missing Android Root Files & Build
        run: |
          APP_DIR=$(find . -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: app directory not found!"
            exit 1
          fi
          
          ANDROID_DIR=$(dirname "$APP_DIR")
          cd "$ANDROID_DIR"
          
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "include ':app'" > settings.gradle
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOF
          fi

          gradle :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My_Android_App_APK
          path: '**/outputs/apk/debug/*.apk'
