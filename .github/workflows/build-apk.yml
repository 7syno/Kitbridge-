name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          for f in *; do
            if file "$f" | grep -q "Zip archive"; then
              unzip -o "$f"
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Capacitor Dependencies
        run: |
          CAP_DIR=$(dirname $(find . -name "capacitor.config.ts" | head -n 1))
          cd "$CAP_DIR"
          if [ ! -f "package.json" ]; then
            npm init -y
          fi
          npm install @capacitor/core@5 @capacitor/android@5 @capacitor/cli@5

      - name: Build APK with Gradle
        run: |
          APP_DIR=$(find . -type d -name "app" | head -n 1)
          ANDROID_DIR=$(dirname "$APP_DIR")
          cd "$ANDROID_DIR"

          if [ ! -f "settings.gradle" ]; then
            cat << 'EOF' > settings.gradle
include ':app'
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')
EOF
          fi

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My_Android_App_APK
          path: '**/outputs/apk/debug/*.apk'
